services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: er_dev
      POSTGRES_PASSWORD: er_dev
      POSTGRES_DB: er_case_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U er_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://er_dev:er_dev@db:5432/er_case_system
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev

  web:
    build: ./apps/web
    depends_on:
      - api
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pgdata:
